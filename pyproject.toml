[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "chromboundary"
version = "0.1.0"
description = "Peak boundary detection in paired LC–MS/MS chromatograms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[project.optional-dependencies]
train = ["scikit-learn>=1.3"]
data = ["openpyxl>=3.1", "joblib>=1.2"]

[project.scripts]
chromboundary = "chromboundary.__main__:main"

[tool.setuptools]
packages = ["chromboundary", "chromboundary.weights"]

[tool.setuptools.package-data]
"chromboundary.weights" = ["*.pt"]
